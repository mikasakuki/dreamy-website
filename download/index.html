<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <link rel="canonical" href="https://jume.app/download" />
  <link rel="shortcut icon" href="/assets/images/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jume.app/download" />
  <meta property="og:title" content="jume laden – App Store & Google Play" />
  <meta property="og:description" content="Halte deine Träume fest, bevor sie verblassen. Kostenlos für iPhone und Android." />
  <meta property="og:site_name" content="jume" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:40px 20px;
      background:var(--gradient-hero, linear-gradient(160deg,#C8D6E7 0%,#F2DFE1 55%,#FFD5C8 100%));
      font-family:"Nunito Sans","Segoe UI",ui-rounded,system-ui,-apple-system,sans-serif;
      color:var(--plum,#53424F);
    }
    .dl-card{
      width:100%;max-width:440px;text-align:center;
      background:var(--white,#fff);
      border-radius:var(--r-xl,32px);
      padding:44px 34px 34px;
      box-shadow:var(--shadow-md,0 8px 48px rgba(83,66,79,.12));
      border:1px solid var(--border,rgba(83,66,79,.1));
    }
    .dl-logo{
      width:76px;height:76px;border-radius:20px;display:block;margin:0 auto 20px;
      box-shadow:0 6px 20px rgba(83,66,79,.16);
    }
    .dl-card h1{
      font-size:1.5rem;line-height:1.25;font-weight:800;letter-spacing:-.01em;
      color:var(--plum,#53424F);margin:0 0 10px;text-wrap:balance;
    }
    .dl-sub{
      font-size:1rem;line-height:1.6;color:var(--plum-muted,#7A6A75);
      max-width:30ch;margin:0 auto 28px;
    }
    .dl-stores{display:flex;flex-direction:column;gap:13px;align-items:center;}
    .dl-badge{
      display:inline-flex;align-items:center;gap:12px;width:100%;max-width:290px;
      padding:13px 24px;border-radius:50px;text-decoration:none;
      background:var(--plum,#53424F);color:#fff;
      box-shadow:0 4px 16px rgba(83,66,79,.28);
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .dl-badge:hover{transform:translateY(-2px);opacity:.94;box-shadow:0 8px 24px rgba(83,66,79,.32);}
    .dl-badge:focus-visible{outline:3px solid var(--peach-mid,#F7BFAE);outline-offset:3px;}
    .dl-badge .lines{display:flex;flex-direction:column;text-align:left;line-height:1.14;}
    .dl-badge .small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.82;}
    .dl-badge .big{font-size:17px;font-weight:800;}
    .dl-redirect{margin:20px 0 0;font-size:.85rem;color:var(--plum-muted,#7A6A75);min-height:1.1em;}
    .dl-back{display:inline-block;margin-top:26px;font-size:.85rem;color:var(--peach-mid,#F7BFAE);font-weight:700;text-decoration:none;}
    .dl-back:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <main class="dl-card">
    <img class="dl-logo" src="/assets/images/apple-touch-icon.png" alt="jume App-Icon" />
    <h1>Halte deine Träume fest, bevor sie verblassen.</h1>
    <p class="dl-sub">Traumtagebuch, Mondimpulse und sanfte Begleitung für deine Nächte. Kostenlos.</p>

    <div class="dl-stores">
      <a class="dl-badge" id="apple" href="https://apps.apple.com/app/id6776764788">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.417 2.2-1.11 2.98-.83.94-2.18 1.66-3.29 1.57-.14-1.1.42-2.28 1.06-3.01.72-.83 1.98-1.46 3.34-1.54zM20.9 17.02c-.55 1.27-.82 1.84-1.53 2.96-.99 1.57-2.39 3.52-4.12 3.53-1.54.02-1.94-1.01-4.03-1-2.09.01-2.53 1.02-4.07 1-1.73-.02-3.05-1.78-4.04-3.35-2.77-4.38-3.06-9.51-1.35-12.24 1.21-1.93 3.13-3.06 4.93-3.06 1.84 0 2.99 1.01 4.51 1.01 1.47 0 2.37-1.01 4.5-1.01 1.61 0 3.32.88 4.54 2.4-3.99 2.19-3.34 7.89.18 9.71z"/></svg>
        <span class="lines"><span class="small">Laden im</span><span class="big">App Store</span></span>
      </a>
      <a class="dl-badge" id="play" href="https://play.google.com/store/apps/details?id=com.juliacialkowski.dreamy">
        <svg width="22" height="24" viewBox="0 0 512 512" aria-hidden="true"><path fill="#00E676" d="M47 24 289 266 47 508c-9-5-15-15-15-27V51c0-12 6-22 15-27z"/><path fill="#FFD600" d="M383 208 47 24c8-5 18-4 27 1l248 143z"/><path fill="#FF3D00" d="M383 324 74 487c-9 5-19 6-27 1l336-184z"/><path fill="#2196F3" d="M383 208 322 168l157 88c17 10 17 34 0 44l-96 55-61-40 61-40z"/></svg>
        <span class="lines"><span class="small">Jetzt bei</span><span class="big">Google Play</span></span>
      </a>
    </div>

    <p class="dl-redirect" id="redirect"></p>
    <a class="dl-back" href="/">← zurück zu jume.app</a>
  </main>

  <script>
    (function(){
      var ua = navigator.userAgent || navigator.vendor || '';
      var appleWeb = 'https://apps.apple.com/app/id6776764788';
      var appleApp = 'itms-apps://apps.apple.com/app/id6776764788';
      var play  = 'https://play.google.com/store/apps/details?id=com.juliacialkowski.dreamy';
      var msg = document.getElementById('redirect');
      var isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;
      var isAndroid = /Android/i.test(ua);
      var inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|TikTok|Snapchat|Pinterest/i.test(ua);

      // Auf iOS den App-Store-Button aufs itms-apps-Schema setzen -> oeffnet den
      // App Store zuverlaessiger, auch in In-App-Browsern (Instagram/Facebook),
      // wo apps.apple.com-Universal-Links oft nicht durchgereicht werden.
      var appleEl = document.getElementById('apple');
      if (isIOS && appleEl) appleEl.setAttribute('href', appleApp);

      if (inApp) {
        // In-App-Browser leiten Store-Links oft nicht durch -> Hinweis statt Auto-Redirect.
        msg.innerHTML = 'Reagiert ein Button nicht? Tippe oben im Menu (•••) auf ' +
                        '<b>&bdquo;In Safari &ouml;ffnen&ldquo;</b> bzw. &bdquo;Im Browser &ouml;ffnen&ldquo;.';
        return;
      }
      if (isIOS) { msg.textContent = 'Wir bringen dich zum App Store …'; setTimeout(function(){ location.href = appleApp; }, 500); }
      else if (isAndroid) { msg.textContent = 'Wir bringen dich zu Google Play …'; setTimeout(function(){ location.replace(play); }, 500); }
    })();
  </script>
</body>
</html>

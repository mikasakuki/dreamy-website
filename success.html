<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Du bist dabei – jume</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script defer src="assets/js/site.js"></script>
</head>
<body data-depth="" data-active="">
  <div id="site-header"></div>

  <main>
    <section style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 60px 20px;">
      <div style="max-width: 480px; width: 100%; text-align: center;">

        <div style="font-size: 48px; margin-bottom: 24px;">🌕</div>

        <span class="section-kicker" id="su-kicker">Willkommen</span>

        <h1 style="font-size: 2rem; margin: 12px 0 16px;" id="su-title">Du bist dabei 🎉</h1>

        <p style="font-size: 1.05rem; line-height: 1.65; color: var(--color-text-muted, #7a6a75); margin-bottom: 32px;" id="su-body">
          Schön, dass du dabei bist. Du erhältst gelegentlich Neuigkeiten zu jume, neue Mondimpulse und kleine Einblicke in das, was wächst.<br />Ruhig, selten und ohne Lärm.
        </p>

        <a href="/" class="btn btn-primary" id="su-back">Zur Startseite</a>

      </div>
    </section>

    <script>
      (function () {
        var pref = null; try { pref = localStorage.getItem('jume_lang'); } catch (e) {}
        var nav = (navigator.language || '').toLowerCase();
        var en = false;
        if (pref === 'en') en = true;
        else if (!pref && nav && nav.indexOf('de') !== 0) en = true;
        if (!en) return;
        document.documentElement.lang = 'en';
        document.getElementById('su-kicker').textContent = 'Welcome';
        document.getElementById('su-title').textContent = "You're in 🎉";
        document.getElementById('su-body').innerHTML = "So glad you're here. You'll occasionally get news about jume, new moon impulses and small glimpses of what's growing.<br />Calm, rare and without noise.";
        var back = document.getElementById('su-back'); back.textContent = 'To the homepage'; back.href = '/en/';
      })();
    </script>
  </main>

  <div id="site-footer"></div>
</body>
</html>
